name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/src/shared/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/src/shared/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shared contract matches the backend's (run `npm run sync:shared` in frontend/ to fix)
        working-directory: .
        run: diff -r backend/src/shared frontend/src/shared
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
